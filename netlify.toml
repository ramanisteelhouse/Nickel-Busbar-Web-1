# Netlify build and function configuration.
#
# The routing table is NOT here: it is generated into public/_redirects by
# scripts/generate-netlify-redirects.ts during prebuild, so it stays in step with the route
# lists the renderer owns. See that script for why.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # The build runs prebuild (sitemap, llms.txt, _redirects) then vite build. Node 22 matches
  # the runtime the functions below use, so build and runtime agree on ESM resolution.
  NODE_VERSION = "22"

[functions]
  # The functions are TypeScript ESM; esbuild is what compiles them.
  node_bundler = "esbuild"

  # ssrHandler.ts reads the built shell at runtime to inject each snapshot into it. Without
  # this the file is not in the bundle, loadTemplate throws on every request, and every page
  # serves the 503 shell.
  included_files = ["dist/index.html"]

  # Left unbundled. pg resolves its native driver dynamically and twilio and nodemailer both
  # carry optional or conditional requires; esbuild inlines those decisions at build time and
  # gets them wrong, which surfaces as a runtime module error rather than a build failure.
  external_node_modules = ["pg", "pg-native", "twilio", "nodemailer"]

# Applied to every response. These mirror the header block vercel.json set, so the move does
# not quietly drop the site's security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The synced product photos are content-addressed by slug and only change when the catalogue
# does, so they can be cached hard. Everything else stays revalidating.
[[headers]]
  for = "/img/products/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
