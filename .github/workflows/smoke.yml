name: Post-deploy smoke check

# Triggered by push, not deployment_status. The only deployment events this repository has ever
# received come from the "Production Build (GitHub Secrets)" workflow, whose job declares
# `environment: production`: GitHub records every run of it as a deployment whose URL is the
# Actions job page. This check used that URL as the site to test, so it was fetching
# github.com/.../job/<id>/about and failing on every push without ever reaching the website.
# Vercel reports to this repository through commit statuses, not deployment events.
#
# So on push it now waits until production actually serves the pushed commit — read from
# /version.json, which the build writes — and only then smoke checks the live site. If Vercel
# never deploys the commit, the wait fails with a message saying so. That is the failure that went
# unnoticed for four days when the repository changed owner and Vercel stopped receiving pushes.
on:
  push:
    branches:
      - main
  # So a deploy can be re-checked by hand, or a preview URL checked before promoting it.
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to smoke check
        required: false
        default: https://www.nickelbusbar.com

# A newer push supersedes an older one still waiting for its deploy.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_BASE_URL: ${{ github.event.inputs.url || 'https://www.nickelbusbar.com' }}

    steps:
      - name: Wait for production to serve this commit
        if: github.event_name == 'push'
        env:
          EXPECTED: ${{ github.sha }}
        shell: bash
        run: |
          # Vercel normally builds in 2-4 minutes. Twenty leaves room for a slow queue without
          # letting a deploy that is never coming pass for one that is merely late.
          deadline=$((SECONDS + 1200))
          live=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            live=$(curl -fsS --max-time 20 "$SMOKE_BASE_URL/version.json?t=$SECONDS" 2>/dev/null \
              | grep -oE '"commit": *"[0-9a-f]+"' | grep -oE '[0-9a-f]{7,}' || true)
            if [ "$live" = "$EXPECTED" ]; then
              echo "Production is serving ${EXPECTED:0:7}."
              exit 0
            fi
            echo "Waiting: production serves ${live:-no version.json yet}, expecting $EXPECTED"
            sleep 30
          done
          echo "::error::Production did not serve ${EXPECTED:0:7} within 20 minutes (it serves ${live:-an older build with no version.json}). Vercel has not deployed this commit: check the Vercel project's Deployments list, and that the Vercel GitHub App has access to this repository."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Smoke check
        run: npm run smoke
