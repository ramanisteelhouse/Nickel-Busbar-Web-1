<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Continuous versus pulsed current: why duty cycle changes the safe current of a nickel strip</title>
  <desc id="d">Schematic, not measured data. With short current pulses and long rests, a nickel strip's temperature rises and falls and stays below the safe limit. With the same peak current but longer or more frequent pulses, heat builds up pulse after pulse and the temperature crosses the safe limit. Joule heating is instant, but temperature rise takes time.</desc>
  <rect x="1" y="1" width="798" height="558" rx="14" fill="#f6f9fa" stroke="#d9e0e2" stroke-width="2"/>
  <text x="400" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#304e58">Same current, different duty cycle</text>
  <text x="400" y="76" text-anchor="middle" font-size="19" fill="#51656c">Heating is instant. Temperature rise takes time.</text>
  <text x="28" y="106" font-size="21" font-weight="700" fill="#1f3a43">Short pulses, long rests</text>
  <text x="28" y="128" font-size="17" fill="#51656c">Heat escapes between pulses</text>
  <text x="78" y="142" text-anchor="end" font-size="15" fill="#6a7b82">Current</text>
