<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Worked example: resistance and heat in an 18650 zig-zag nickel strip</title>
  <desc id="d">A nickel strip 0.20 mm thick and 44 mm wide, with 19 mm between cell contacts, has a cross-section of 8.8 square millimetres. Using resistivity 9.5 times ten to the minus eight ohm-metres, its resistance is about 0.205 milliohms. Heat in the strip body at 10, 20 and 30 amps is 0.021, 0.082 and 0.185 watts.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#304e58"/></marker>
    <marker id="arL" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M9,1 L1,5 L9,9 Z" fill="#304e58"/></marker>
  </defs>
  <rect x="1" y="1" width="798" height="578" rx="14" fill="#f6f9fa" stroke="#d9e0e2" stroke-width="2"/>
  <text x="400" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#304e58">Worked example: Ni 18650 2P zig-zag strip</text>
  <text x="400" y="76" text-anchor="middle" font-size="19" fill="#51656c">0.20 mm thick × 44 mm wide, 19 mm centre distance</text>

  <text x="215" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#1f3a43">Side view: the current path</text>
  <rect x="45" y="168" width="340" height="16" rx="3" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
  <circle cx="105" cy="176" r="12" fill="#304e58"/><circle cx="325" cy="176" r="12" fill="#304e58"/>
  <text x="105" y="150" text-anchor="middle" font-size="17" fill="#3d5159">weld</text>
  <text x="325" y="150" text-anchor="middle" font-size="17" fill="#3d5159">weld</text>
  <line x1="118" y1="176" x2="310" y2="176" stroke="#d4551f" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
  <line x1="105" y1="206" x2="325" y2="206" stroke="#304e58" stroke-width="2.5" marker-start="url(#arL)" marker-end="url(#ar)"/>
  <text x="215" y="236" text-anchor="middle" font-size="21" font-weight="700" fill="#304e58">L = 19 mm</text>

  <text x="600" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#1f3a43">End view: the cross-section</text>
  <rect x="468" y="170" width="264" height="14" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
  <line x1="468" y1="150" x2="732" y2="150" stroke="#304e58" stroke-width="2.5" marker-start="url(#arL)" marker-end="url(#ar)"/>
  <text x="600" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#304e58">w = 44 mm</text>
  <text x="600" y="208" text-anchor="middle" font-size="19" font-weight="700" fill="#304e58">t = 0.20 mm <tspan font-size="15" font-weight="400" fill="#6a7b82">(not to scale)</tspan></text>
  <text x="600" y="236" text-anchor="middle" font-size="21" font-weight="700" fill="#304e58">A = 8.8 mm²</text>

  <rect x="28" y="256" width="744" height="116" rx="12" fill="#e8f0f2"/>
  <text x="400" y="292" text-anchor="middle" font-size="26" font-weight="700" fill="#1f3a43">R = ρ × L ÷ A</text>
  <text x="400" y="326" text-anchor="middle" font-size="20" fill="#304e58">= (9.5×10<tspan dy="-8" font-size="14">−8</tspan><tspan dy="8"> Ω·m × 0.019 m) ÷ (8.8×10</tspan><tspan dy="-8" font-size="14">−6</tspan><tspan dy="8"> m²)</tspan></text>
  <text x="400" y="358" text-anchor="middle" font-size="26" font-weight="700" fill="#d4551f">R ≈ 0.205 mΩ</text>

  <text x="28" y="404" font-size="20" font-weight="700" fill="#1f3a43">Heat in the strip body only, P = I² × R</text>
  <g font-size="20" fill="#1f3a43">
    <text x="28" y="440" font-weight="700">10 A</text>
    <rect x="96" y="422" width="45" height="26" rx="4" fill="#2f7d6d"/>
    <text x="152" y="441" font-weight="700">0.021 W</text>

    <text x="28" y="482" font-weight="700">20 A</text>
    <rect x="96" y="464" width="177" height="26" rx="4" fill="#d9962b"/>
    <text x="284" y="483" font-weight="700">0.082 W</text>

    <text x="28" y="524" font-weight="700">30 A</text>
    <rect x="96" y="506" width="400" height="26" rx="4" fill="#d4551f"/>
    <text x="508" y="525" font-weight="700">0.185 W</text>
  </g>
  <text x="772" y="440" text-anchor="end" font-size="18" fill="#51656c">2× current</text>
  <text x="772" y="464" text-anchor="end" font-size="18" fill="#51656c">≈ 4× heat</text>
  <text x="400" y="562" text-anchor="middle" font-size="15" fill="#6a7b82">The two weld joints add more resistance, so real heat is higher.</text>
</svg>
