<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">From nickel strip size to temperature rise</title>
  <desc id="d">Four steps decide whether a nickel strip runs cool: strip size sets the cross-section area A and path length L; resistance R equals resistivity times length divided by area; heat P equals current squared times resistance; and temperature depends on how fast that heat escapes. Steps one to three can be calculated on paper, while step four needs a thermal test.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#304e58"/></marker>
  </defs>
  <rect x="1" y="1" width="798" height="468" rx="14" fill="#f6f9fa" stroke="#d9e0e2" stroke-width="2"/>
  <text x="400" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#304e58">From strip size to temperature</text>
  <text x="400" y="82" text-anchor="middle" font-size="19" fill="#51656c">Four steps decide whether a nickel strip runs cool</text>

  <g text-anchor="middle">
    <rect x="18" y="108" width="170" height="168" rx="12" fill="#fff" stroke="#c5d1d5" stroke-width="2"/>
    <circle cx="48" cy="136" r="15" fill="#304e58"/><text x="48" y="143" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="113" y="143" font-size="23" font-weight="700" fill="#1f3a43">Size</text>
    <text x="103" y="188" font-size="22" font-weight="700" fill="#304e58">A = t × w</text>
    <text x="103" y="222" font-size="18" fill="#3d5159">thickness × width,</text>
    <text x="103" y="246" font-size="18" fill="#3d5159">plus path length L</text>

    <rect x="216" y="108" width="170" height="168" rx="12" fill="#fff" stroke="#c5d1d5" stroke-width="2"/>
    <circle cx="246" cy="136" r="15" fill="#304e58"/><text x="246" y="143" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="323" y="143" font-size="23" font-weight="700" fill="#1f3a43">Resistance</text>
    <text x="301" y="188" font-size="22" font-weight="700" fill="#304e58">R = ρ × L ÷ A</text>
    <text x="301" y="222" font-size="18" fill="#3d5159">longer or narrower</text>
    <text x="301" y="246" font-size="18" fill="#3d5159">= more resistance</text>

    <rect x="414" y="108" width="170" height="168" rx="12" fill="#fff" stroke="#c5d1d5" stroke-width="2"/>
    <circle cx="444" cy="136" r="15" fill="#304e58"/><text x="444" y="143" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="520" y="143" font-size="23" font-weight="700" fill="#1f3a43">Heat</text>
    <text x="499" y="188" font-size="22" font-weight="700" fill="#304e58">P = I² × R</text>
    <text x="499" y="222" font-size="18" fill="#3d5159">double the current,</text>
    <text x="499" y="246" font-size="18" fill="#3d5159">about 4× the heat</text>

    <rect x="612" y="108" width="170" height="168" rx="12" fill="#fff" stroke="#d4551f" stroke-width="2.5"/>
    <circle cx="642" cy="136" r="15" fill="#d4551f"/><text x="642" y="143" font-size="18" font-weight="700" fill="#fff">4</text>
    <text x="722" y="143" font-size="23" font-weight="700" fill="#1f3a43">Temp.</text>
    <text x="697" y="188" font-size="19" font-weight="700" fill="#d4551f">heat in vs out</text>
    <text x="697" y="222" font-size="18" fill="#3d5159">depends on how fast</text>
    <text x="697" y="246" font-size="18" fill="#3d5159">the heat escapes</text>
  </g>
  <line x1="190" y1="192" x2="214" y2="192" stroke="#304e58" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="388" y1="192" x2="412" y2="192" stroke="#304e58" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="586" y1="192" x2="610" y2="192" stroke="#304e58" stroke-width="3" marker-end="url(#ar)"/>

  <path d="M18 296 V306 H584 V296" fill="none" stroke="#2f7d6d" stroke-width="3"/>
  <text x="301" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#2f7d6d">Steps 1–3: calculate on paper</text>
  <path d="M612 296 V306 H782 V296" fill="none" stroke="#d4551f" stroke-width="3"/>
  <text x="697" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#d4551f">Step 4: test it</text>

  <rect x="18" y="360" width="764" height="92" rx="12" fill="#e8f0f2"/>
  <text x="400" y="392" text-anchor="middle" font-size="19" font-weight="700" fill="#1f3a43">What carries the heat away in step 4</text>
  <text x="400" y="422" text-anchor="middle" font-size="19" fill="#3d5159">wider surface · airflow or potting · cooler neighbouring cells · rest between pulses</text>
</svg>
